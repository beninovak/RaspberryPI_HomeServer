<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="Styles/fonts.css">
    <link rel="stylesheet" href="Styles/general.css">
    <link rel="icon" type="image/x-icon" href="./Assets/favicon.ico">
</head>
<body class="no-auth-page">
    <form method="post" action="/api/register" onsubmit="return false;">
        <h1>Register</h1>
    
        <div class="group half">
            <label for="FirstName">First name</label>
            <input id="FirstName" name="FirstName" type="text" placeholder="First name">
        </div>

        <div class="group half">
            <label for="LastName">Last name</label>
            <input id="LastName" name="LastName" type="text" placeholder="Last name">
        </div>
        
        <div class="group">
            <label for="Email">Email</label>
            <input id="Email" name="Email" type="email" placeholder="Email">
        </div>

        <div class="group">
            <label for="Password">Password</label>
            <input id="Password" name="Password" type="password" placeholder="Password">
        </div>
        
        <div class="group">
            <label for="PasswordConfirm">Confirm password</label>
            <input id="PasswordConfirm" name="PasswordConfirm" type="password" placeholder="Confirm password">
        </div>
    
        <div class="group button">
            <button class="submit" type="button">Register</button>
            <a href="/login">Login</a>
        </div>
    </form>

    <script src="dist/forms.js" type="module"></script>
</body>
</html>
