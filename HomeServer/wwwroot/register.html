<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="Styles/fonts.css">
    <link rel="stylesheet" href="Styles/general.css">
</head>
<body class="no-auth-page">
    <form method="post" action="/api/register">
        <h1>Register</h1>
    
        <div class="group half">
            <label for="first-name">First name</label>
            <input id="first-name" name="first-name" type="text" placeholder="First name">
        </div>

        <div class="group half">
            <label for="last-name">Last name</label>
            <input id="last-name" name="last-name" type="text" placeholder="Last name">
        </div>
        
        <div class="group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Email">
        </div>

        <div class="group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Password">
        </div>
        
        <div class="group">
            <label for="password-confirm">Confirm password</label>
            <input id="password-confirm" name="password-confirm" type="password" placeholder="Confirm password">
        </div>
    
        <div class="group button">
            <button type="submit">Register</button>
            <a href="/login">Login</a>
        </div>
    </form>
</body>
</html>
